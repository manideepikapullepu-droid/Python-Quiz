<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CodeQuest - Quiz & Coding Practice</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    color:#202038;
}

/* NAVBAR */
.navbar{
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.navbar-brand{
    font-weight:800;
    font-size:24px;
}

/* HERO */
.hero{
    min-height:80vh;
    display:flex;
    align-items:center;
    background:
        radial-gradient(circle at 85% 20%,rgba(108,92,231,.2),transparent 30%),
        radial-gradient(circle at 10% 80%,rgba(0,184,148,.15),transparent 30%),
        linear-gradient(135deg,#fff,#f0efff);
}

.hero-title{
    font-size:clamp(40px,7vw,75px);
    font-weight:800;
}

.gradient{
    background:linear-gradient(90deg,#6c5ce7,#00b894);
    -webkit-background-clip:text;
    color:transparent;
}

.card-custom{
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.course-card{
    transition:.3s;
    height:100%;
}

.course-card:hover{
    transform:translateY(-8px);
    box-shadow:0 18px 40px rgba(0,0,0,.15);
}

.course-icon{
    width:60px;
    height:60px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    background:#eeeaff;
    color:#6c5ce7;
}

/* AUTH */
.auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#18182c,#5144b5,#00b894);
    padding:20px;
}

.auth-box{
    width:450px;
    max-width:100%;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

/* SIDEBAR */
.sidebar{
    background:#17172b;
    color:white;
    min-height:calc(100vh - 66px);
    padding:20px;
}

.sidebar a{
    display:block;
    color:#cfd0e5;
    text-decoration:none;
    padding:13px;
    margin:5px 0;
    border-radius:12px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#353552;
    color:white;
}

/* STAT */
.stat{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.stat-number{
    font-size:30px;
    font-weight:800;
}

.coin{
    color:#f5a623;
}

.streak{
    color:#ff6337;
}

/* QUESTION */
.option{
    padding:16px;
    border:2px solid #e5e5ef;
    border-radius:15px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#6c5ce7;
    background:#f7f5ff;
}

.option.selected{
    background:#eeeaff;
    border-color:#6c5ce7;
}

/* CODE */
.code{
    background:#161625;
    color:#eee;
    padding:20px;
    border-radius:15px;
    white-space:pre-wrap;
    font-family:Consolas,monospace;
}

/* ANIMATION */
.animate{
    animation:slide .5s ease;
}

@keyframes slide{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.float{
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    50%{
        transform:translateY(-12px);
    }
}

/* MOBILE */
@media(max-width:768px){

    .sidebar{
        min-height:auto;
    }

    .hero{
        padding:60px 0;
    }

    .hero-title{
        font-size:45px;
    }

    .main{
        padding:15px !important;
    }
}
</style>
</head>

}


function register(e){

    e.preventDefault();

    let id=document.getElementById("regID").value.trim();

    let email=document.getElementById("regEmail").value.trim();

    if(database.users.some(u=>u.id===id)){
        alert("Student ID already exists");
        return;
    }

    database.users.push({

        id:id,

        name:document.getElementById("regName").value,

        email:email,

        password:document.getElementById("regPassword").value,

        role:"student",

        coins:0,

        streak:1

    });

    saveDB();

    alert("Registration successful!");

    loginPage();
}

function login(e){

    e.preventDefault();

    let id=document
        .getElementById("loginID")
        .value.trim();

    let password=document
        .getElementById("loginPassword")
        .value;

    let user=database.users.find(u=>

        (u.id.toLowerCase()===id.toLowerCase()
        ||
        u.email.toLowerCase()===id.toLowerCase())

        &&
        u.password===password

    );

    if(!user){

        alert("Invalid login details");

        return;
    }

    loginUser(user);

    if(user.role==="admin")
        adminDashboard();
    else
        dashboard();
}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    currentUser=null;

    localStorage.removeItem(
        "codequestUser"
    );

    home();
}


/* =====================================================
   STUDENT DASHBOARD
===================================================== */

function dashboard(){

    if(!currentUser)
        return loginPage();

    if(currentUser.role==="admin")
        return adminDashboard();

    let results=database.results
        .filter(r=>r.studentID===currentUser.id);

    let average=results.length
        ?
        Math.round(
            results.reduce(
                (a,b)=>a+b.percentage,0
            )/results.length
        )
        :0;

    document.getElementById("app").innerHTML=`

    ${navbar()}

    <div class="container-fluid">

        <div class="row">

            <div class="col-lg-2 p-0">

                ${studentSidebar()}

            </div>


            <div class="col-lg-10 p-4 main">

                                </div>

                            </div>

                        </div>

                                    Daily Streak

                                    🔥

                            </div>

                        </div>


                        <div class="col-6 col-xl-3">

                            <div class="stat">

/* =====================================================
   COURSES
===================================================== */

function showCourse(course){

    if(!currentUser){

        return loginPage();

    }

    quizPage(course);

}


/* =====================================================
   QUIZ PAGE
===================================================== */

function quizPage(course=""){

    let quizzes=database.quizzes;

    if(course)
        quizzes=quizzes.filter(q=>q.course===course);

    document.getElementById("app").innerHTML=`

    ${navbar()}

    <div class="container-fluid">

        <div class="row">

            <div class="col-lg-2 p-0">

                ${studentSidebar()}

                <p class="text-secondary">
                    Choose a course and start your exam.
                </p>


                <div class="row g-4 mt-2">

                    ${quizzes.map(q=>`

                    <div class="col-md-6 col-xl-4">

                        <div class="card-custom course-card">

                            <span class="badge bg-primary">
                                ${q.course}
                            </span>

                            <h4 class="mt-3">
                                ${q.title}
                            </h4>

                            <p class="text-secondary">
                                ${q.questions.length}
                                Questions
                            </p>

                            <p>
                                ⏱ ${q.time} Minutes
                            </p>

                            <button

                            onclick="startQuiz('${q.id}')">

/* =====================================================
   QUIZ ENGINE
===================================================== */

let quiz=null;

function startQuiz(id){

    let q=database.quizzes.find(
        x=>x.id===id
    );

    quiz={

        quiz:q,

        current:0,

        answers:Array(q.questions.length)
            .fill(null),

        time:q.time*60

    };

    renderQuestion();

    quiz.timer=setInterval(()=>{

        quiz.time--;

        let timer=document.getElementById(
            "timer"
        );

        if(timer){

            let min=Math.floor(
                quiz.time/60
            );

            let sec=quiz.time%60;

            timer.innerText=
                String(min).padStart(2,"0")
                +":"
                +
                String(sec).padStart(2,"0");

        }

        if(quiz.time<=0){

            clearInterval(quiz.timer);

            finishQuiz();

        }

    },1000);

}


/* =====================================================
   QUESTION
===================================================== */

function renderQuestion(){

    let q=quiz.quiz;

    let question=
        q.questions[quiz.current];

    document.getElementById("app").innerHTML=`

    ${navbar()}

    <div class="container py-4 animate">

        <div class="d-flex justify-content-between">

            <h3>
                ${q.title}
            </h3>

            <h4 id="timer"
            class="text-danger">

            </h4>

        </div>


        <div class="progress my-3">

            <div
            class="progress-bar"
            style="
            width:${((quiz.current+1)/q.questions.length)*100}%;
            ">

            </div>

        </div>


        <div class="card-custom">

            <p class="text-secondary">

                Question
                ${quiz.current+1}
                of
                ${q.questions.length}

            </p>

            <h4 class="mb-4">

                ${question.question}

            </h4>


            ${question.options.map(
                (option,index)=>`

                <div
                class="option
                ${quiz.answers[quiz.current]===index
                ?"selected":""}"

                onclick="selectAnswer(${index})">

                    <b>
                        ${String.fromCharCode(65+index)}.
                    </b>

                    ${option}

                </div>

            `).join("")}


            <div
            class="d-flex
            justify-content-between
            mt-4">

                <button
                class="btn btn-outline-secondary"
                onclick="previousQuestion()"
                ${quiz.current===0?"disabled":""}>

                    ← Previous

                </button>


                ${
                    quiz.current<
                    q.questions.length-1

                    ?

                    `<button
                    class="btn btn-primary"
                    onclick="nextQuestion()">

                    Next →

                    </button>`

                    :

                    `<button
                    class="btn btn-success"
                    onclick="finishQuiz()">

                    Submit Exam

                    </button>`
                }

            </div>

        </div>

    </div>

    `;

    updateTimer();

}


/* =====================================================
   ANSWER
===================================================== */

function selectAnswer(index){

    quiz.answers[quiz.current]=index;

    renderQuestion();

}


function nextQuestion(){

    if(
        quiz.answers[quiz.current]===null
    ){

        alert("Please select an answer.");

        return;

    }

    quiz.current++;

    renderQuestion();

}


function previousQuestion(){

    if(quiz.current>0){

        quiz.current--;

        renderQuestion();

    }

}


function updateTimer(){

    let timer=
        document.getElementById("timer");

    if(!timer)return;

    let min=Math.floor(
        quiz.time/60
    );

    let sec=quiz.time%60;

    timer.innerText=
        String(min).padStart(2,"0")
        +":"
        +
        String(sec).padStart(2,"0");

}


/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz(){

    clearInterval(quiz.timer);

    let correct=0;

    quiz.quiz.questions.forEach(
        (q,i)=>{

            if(
                quiz.answers[i]===q.answer
            )
                correct++;

        }
    );


    let total=quiz.quiz.questions.length;

    let percentage=
        Math.round(
            correct/total*100
        );


    let coins=
        Math.max(
            10,
            percentage
        );


    currentUser.coins+=coins;


    let result={

        id:Date.now(),

        studentID:currentUser.id,

        studentName:currentUser.name,

        quiz:quiz.quiz.title,

        course:quiz.quiz.course,

        score:correct,

        total:total,

        percentage:percentage,

        coins:coins,

        answers:quiz.answers,

        date:new Date().toLocaleString()

    };


    database.results.push(result);

    saveDB();


    showResult(result);

}


/* =====================================================
   RESULT
===================================================== */

function showResult(result){

    let q=database.quizzes.find(
        x=>x.title===result.quiz
    );

    let wrong=[];

    q.questions.forEach(
        (question,index)=>{

            if(
                result.answers[index]
                !==question.answer
            ){

                wrong.push({
                    question,
                    index
                });

            }

        }
    );


    document.getElementById("app").innerHTML=`

    ${navbar()}

    <div class="container py-4">

        <div class="card-custom text-center animate">

            <div style="font-size:70px">
                ${
                    result.percentage>=80
                    ?"🏆"
                    :"📚"
                }
            </div>

            <h2>
                Exam Completed!
            </h2>

            <p class="text-secondary">
                Great work ${result.studentName}
            </p>


            <div class="row g-3 justify-content-center mt-4">

                <div class="col-6 col-md-3">

                    <div class="stat">

                        <small>Score</small>

                        <h2>
                            ${result.score}/${result.total}
                        </h2>

                    </div>

                </div>


                <div class="col-6 col-md-3">

                    <div class="stat">

                        <small>Percentage</small>

                        <h2>
                            ${result.percentage}%
                        </h2>

                    </div>

                </div>


                <div class="col-6 col-md-3">

                    <div class="stat">

                        <small>Coins</small>

                        <h2 class="coin">

                            +${result.coins}

                        </h2>

                    </div>

                </div>

            </div>


            <button
            class="btn btn-primary mt-4"
            onclick="dashboard()">

            Dashboard

            </button>

        </div>


        <div class="card-custom mt-4">

            <h3>
                ❌ Wrong Answers & Explanations
            </h3>

            ${
                wrong.length
                ?

                wrong.map(w=>{

                    let question=w.question;

                    let selected=
                        result.answers[w.index];

                    return `

                    <div
                    class="border rounded-4 p-3 my-3">

                        <h5>
                            Q${w.index+1}.
                            ${question.question}
                        </h5>

                        <p class="text-danger">

                            Your Answer:
                            ${
                                selected===null
                                ?"Not answered"
                                :question.options[selected]
                            }

                        </p>

                        <p class="text-success">

                            Correct Answer:
                            ${question.options[question.answer]}

                        </p>

                        <div class="alert alert-info">

                            <b>Explanation:</b>

                            ${question.explanation}

                        </div>

                    </div>

                    `;

                }).join("")

                :

                `<div class="alert alert-success">
                    🎉 Perfect Score! No wrong answers.
                </div>`
            }

        </div>

    </div>

    `;

}

function escapeHTML(text){

    return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

function createQuiz(e){

    e.preventDefault();


    let quiz={

        id:"q"+Date.now(),

        course:
            document.getElementById(
                "quizCourse"
            ).value,

        title:
            document.getElementById(
                "quizTitle"
            ).value,

        time:
            Number(
                document.getElementById(
                    "quizTime"
                ).value
            ),

        questions:[{

            question:
                document.getElementById(
                    "quizQuestion"
                ).value,

            options:[

                document.getElementById("opt1").value,

                document.getElementById("opt2").value,

                document.getElementById("opt3").value,

                document.getElementById("opt4").value

            ],

            answer:
                Number(
                    document.getElementById(
                        "correct"
                    ).value
                ),

            explanation:
                document.getElementById(
                    "explanation"
                ).value

        }]

    };


    database.quizzes.push(quiz);

    saveDB();

    alert("Quiz created successfully!");

    adminQuizzes();

}


function deleteQuiz(id){

    if(confirm("Delete this quiz?")){

        database.quizzes=
            database.quizzes.filter(
                q=>q.id!==id
            );

        saveDB();

        adminQuizzes();

    }

}
